[project]
name = "wind-decision"
version = "0.1.0"
description = "Elexon wind forecast accuracy pipeline and API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.12.0,<3",
    "uvicorn[standard]>=0.37.0,<1",
]

[project.scripts]
refresh-elexon-data = "wind_decision.refresh:main"

[build-system]
requires = ["uv_build>=0.9.0,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2",
    "pytest>=8.4.0,<9",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.14.0,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wind_decision"]

